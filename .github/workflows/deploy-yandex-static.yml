name: 'Yandex Cloud Static Export'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 'Build Static Export and Deploy to Yandex Cloud'
    runs-on: ubuntu-latest

    environment:
      name: Yandex Cloud Production
      url: https://${{ vars.DOMAIN }}

    env:
      NEXT_PUBLIC_BUILDER_API_KEY: ${{ secrets.NEXT_PUBLIC_BUILDER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Patch next.config.ts for static export
        run: bun run scripts/patch-static-export.ts

      - name: Build static export
        run: bun run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=0.136.0"

      - name: Configure Yandex Cloud CLI
        uses: yc-actions/yc-cli-install@v1
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_cert_id: ${{ secrets.YC_CERT_ID }}
          TF_VAR_dns_zone_id: ${{ secrets.YC_DNS_ZONE_ID }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_cert_id: ${{ secrets.YC_CERT_ID }}
          TF_VAR_dns_zone_id: ${{ secrets.YC_DNS_ZONE_ID }}
        run: terraform apply -auto-approve

      - name: Upload static files to Yandex Object Storage
        working-directory: ./out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync . s3://${{ vars.DOMAIN }} \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete \
            --acl public-read

      - name: Deployment status
        run: |
          echo "✅ Static export deployed successfully to Yandex Cloud"
          echo "🌐 URL: https://${{ vars.DOMAIN }}"
