name: 'Yandex Cloud Static Export'

on:
  push:
    branches:
      - ycloud/**
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 'Build Static Export and Deploy to Yandex Cloud'
    runs-on: ubuntu-latest

    environment:
      name: Yandex Cloud Production
      url: https://${{ vars.YC_DOMAIN }}

    env:
      NEXT_PUBLIC_BUILDER_API_KEY: ${{ secrets.NEXT_PUBLIC_BUILDER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Patch next.config.ts for static export
        run: bun run scripts/patch-static-export.ts

      - name: Build static export
        run: bun run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=0.136.0"

      - name: Configure Yandex Cloud CLI
        uses: artabr/yc-cli-install@master
        with:
          SA_KEY: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Export Yandex Cloud credentials
        id: yc-creds
        env:
          YC_SERVICE_ACCOUNT_ID: ${{ vars.YC_SERVICE_ACCOUNT_ID }}
        run: |
          echo "YC_TOKEN=$(yc iam create-token)" >> $GITHUB_ENV
          echo "YC_CLOUD_ID=$(yc config get cloud-id)" >> $GITHUB_ENV
          echo "YC_FOLDER_ID=$(yc config get folder-id)" >> $GITHUB_ENV
          
          # Create static access key and parse output
          ACCESS_KEY_JSON=$(yc iam access-key create --service-account-id $YC_SERVICE_ACCOUNT_ID --format json)
          echo "YC_STORAGE_ACCESS_KEY=$(echo $ACCESS_KEY_JSON | jq -r '.access_key.key_id')" >> $GITHUB_ENV
          echo "YC_STORAGE_SECRET_KEY=$(echo $ACCESS_KEY_JSON | jq -r '.secret')" >> $GITHUB_ENV

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_folder_id: ${{ env.YC_FOLDER_ID }}
          TF_VAR_domain: ${{ vars.YC_DOMAIN }}
          TF_VAR_cert_id: ${{ vars.YC_CERT_ID }}
          TF_VAR_dns_zone_id: ${{ vars.YC_DNS_ZONE_ID }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_folder_id: ${{ env.YC_FOLDER_ID }}
          TF_VAR_domain: ${{ vars.YC_DOMAIN }}
          TF_VAR_cert_id: ${{ vars.YC_CERT_ID }}
          TF_VAR_dns_zone_id: ${{ vars.YC_DNS_ZONE_ID }}
        run: terraform apply -auto-approve

      - name: Upload static files to Yandex Object Storage
        working-directory: ./out
        env:
          AWS_ACCESS_KEY_ID: ${{ env.YC_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.YC_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync . s3://${{ vars.YC_DOMAIN }}-frontend-bucket \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete \
            --acl public-read

      - name: Deployment status
        run: |
          echo "✅ Static export deployed successfully to Yandex Cloud"
          echo "🌐 URL: https://${{ vars.YC_DOMAIN }}"
